  <text x="1038" y="195" font-family="Arial" font-size="11" font-weight="600" fill="#246d62">AI 摘要</text><text x="1038" y="214" font-family="Arial" font-size="9" fill="#7b8680">在网页顶部生成可收起的摘要</text><rect x="1254" y="185" width="38" height="19" rx="10" fill="#1f8b7d"/><circle cx="1281" cy="194" r="7" fill="#fff"/>
