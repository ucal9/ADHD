  <rect width="1400" height="900" fill="#e8ebe7"/><rect x="55" y="48" width="1290" height="804" rx="10" fill="#fbfcfa" stroke="#cbd4ce"/><rect x="55" y="48" width="930" height="804" fill="#f8faf7"/><rect x="55" y="48" width="930" height="48" fill="#f4f6f3"/><circle cx="82" cy="72" r="6" fill="#df7c6f"/><circle cx="101" cy="72" r="6" fill="#d8b35d"/><circle cx="120" cy="72" r="6" fill="#77ae88"/><rect x="245" y="61" width="570" height="24" rx="5" fill="#fff" stroke="#d7dfd8"/><text x="530" y="78" text-anchor="middle" font-family="Arial" font-size="12" fill="#78827c">thepaper.cn / insight / reading-space</text><rect x="210" y="135" width="700" height="90" rx="7" fill="#eaf5f0" stroke="#b8d9cd"/><text x="238" y="163" font-family="Arial" font-size="11" font-weight="600" fill="#246d62">AI 摘要</text><text x="238" y="190" font-family="Arial" font-size="11" fill="#4e675d">好的阅读环境不替人做决定，而是减少噪音，保留恢复原貌的权利。</text><rect x="260" y="270" width="550" height="28" rx="4" fill="#35423b"/><rect x="260" y="326" width="500" height="10" rx="5" fill="#c4cec7"/>
